<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolveTheWordle</title>
    <link rel="icon" href="../favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="style.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

    <nav class="navbar navbar-expand-lg mb-4 mt-3">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold text-primary">
                <i class="bi bi-grid-3x3-gap-fill me-2"></i>SolveTheWordle
            </span>
            <div class="ms-auto">
                <select id="select_dict" class="form-select form-select-sm" aria-label="Select language">
                    <option value="dict_ca">Catalan</option>
                    <option value="dict_en">English</option>
                    <option value="dict_es">Spanish</option>
                </select>
            </div>
        </div>
    </nav>

<main class="container">
    <div class="row g-4">
        
    <div class="col-md-6">
        <div class="card shadow-sm h-100 border-0">
            <div class="card-body p-4 d-flex flex-column">
                
                <div id="input_container" class="d-flex flex-column align-items-center bg-dark-subtle rounded border p-3 mb-3 py-4"> </div>

                <button id="solve_btn" class="btn btn-success fw-bold text-uppercase w-100 py-3 mt-auto shadow-sm">
                    <i class="bi bi-cpu-fill me-2"></i>Solve
                </button>

            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card shadow-sm h-100 border-0">
            <div class="card-body p-4 d-flex flex-column" style="max-height: 80vh;">

              <section class="mb-2 d-flex flex-column" style="min-height: 0;">
                  <div class="d-flex justify-content-between align-items-center mb-2">
                      <h6 class="text-success fw-semibold text-uppercase small mb-0">Possible words</h6>
                      <span id="possible_words_count" class="badge rounded-pill bg-success-subtle text-success border border-success-subtle">0</span>
                  </div>
                  <div id="possible_words_container" class="overflow-y-auto p-2 bg-light-subtle rounded border"></div>
              </section>

                <hr class="opacity-10">

                <section class="d-flex flex-column" style="min-height: 0;">

                  <div class="d-flex justify-content-between align-items-center mb-2">
                      <h6 class="text-info fw-semibold text-uppercase small mb-0">Suggested words</h6>
                      <span id="suggested_words_count" class="badge rounded-pill bg-info-subtle text-info border border-info-subtle">0</span>
                  </div>
                    <div id="suggested_words_container" class="overflow-y-auto p-2 bg-light-subtle rounded border"> </div>
                </section>
            </div>
        </div>
    </div>
    <input id="hidden_input" style="opacity:0; position:absolute; width:0; height:0; border:0; padding:0; margin:0;">
</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>window.dictionaries={};</script>
    <script src="../.dict/wordle/ca.js"></script>
    <script src="../.dict/wordle/en.js"></script>
    <script src="../.dict/wordle/es.js"></script>
    <script src="errors.js"></script>
    <script src="wordle.js"></script>
    <script src="ui.js"></script>
    <script src="main.js"></script>
</body>
</html>
